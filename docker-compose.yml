version: '3.8'

services:

  # ─── Go API (BPMN Engine - replaces Laravel API) ────────────────────────────
  api-go:
    build:
      context: ./api-go
      dockerfile: Dockerfile
    container_name: processmaker_api_go
    restart: unless-stopped
    environment:
      # Database
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: processmaker
      DB_USERNAME: processmaker
      DB_PASSWORD: secret
      # JWT
      JWT_SECRET: ${JWT_SECRET:-processmaker-go-secret-key}
    volumes:
      - pm_storage:/var/www/html/storage
      - ./public:/app/public
    depends_on:
      db:
        condition: service_healthy

    # Open port 88 to map to 3000 of Go App
    ports:
      - "88:3000"

  # ─── MySQL ───────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: processmaker_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: processmaker
      MYSQL_USER: processmaker
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret_root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "processmaker", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ─── Redis (for future WebSocket / queues) ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: processmaker_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  pm_storage:
