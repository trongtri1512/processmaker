version: '3.8'

services:

  # ─── Go API (BPMN Engine - replaces Laravel API) ────────────────────────────
  api-go:
    build:
      context: ./api-go
      dockerfile: Dockerfile
    container_name: processmaker_api_go
    restart: unless-stopped
    environment:
      # Database
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: processmaker
      DB_USERNAME: processmaker
      DB_PASSWORD: secret
      # JWT
      JWT_SECRET: ${JWT_SECRET:-processmaker-go-secret-key}
    volumes:
      - pm_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  # ─── Next.js Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: processmaker_frontend
    restart: unless-stopped
    environment:
      # All API calls now go to Go API
      GO_INTERNAL_URL: http://api-go:3000
      LARAVEL_INTERNAL_URL: http://api-go:3000
      # Public API URL
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost}
      # NextAuth
      NEXTAUTH_URL: ${APP_URL:-http://localhost}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-super-secret-nextauth-key-change-me}
    depends_on:
      - api-go

  # ─── MySQL ───────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: processmaker_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: processmaker
      MYSQL_USER: processmaker
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret_root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "processmaker", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ─── Redis (for future WebSocket / queues) ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: processmaker_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  pm_storage:
