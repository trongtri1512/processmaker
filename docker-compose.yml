version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: processmaker_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=processmaker
      - DB_USERNAME=processmaker
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - BROADCAST_DRIVER=redis
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
    depends_on:
      - db
      - redis

  web:
    image: nginx:alpine
    container_name: processmaker_web
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: processmaker_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: processmaker
      MYSQL_USER: processmaker
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret_root
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:alpine
    container_name: processmaker_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: processmaker_horizon
    restart: unless-stopped
    command: php artisan horizon
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis

  echo-server:
    image: node:16-alpine
    container_name: processmaker_echo_server
    restart: unless-stopped
    command: "npx laravel-echo-server start"
    ports:
      - "6001:6001"
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - redis

volumes:
  db_data:
