[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
logfile_maxbytes=10MB
logfile_backups=3

[program:octane]
command=php /var/www/html/artisan octane:start --server=frankenphp --host=0.0.0.0 --port=80 --workers=auto --task-workers=auto --max-requests=500
directory=/var/www/html
user=root
autostart=true
autorestart=true
priority=10
environment=FRANKENPHP_CONFIG="worker ./public/index.php"
stderr_logfile=/var/log/supervisor/octane.err.log
stdout_logfile=/var/log/supervisor/octane.out.log

[program:horizon]
command=php /var/www/html/artisan horizon
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=20
startretries=5
startsecs=3
stderr_logfile=/var/log/supervisor/horizon.err.log
stdout_logfile=/var/log/supervisor/horizon.out.log

; Reverb disabled – install laravel/reverb first then uncomment
; [program:reverb]
; command=php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=8080 --no-interaction
