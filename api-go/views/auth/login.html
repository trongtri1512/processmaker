<div class="container d-flex align-items-center justify-content-center" style="height: 100vh;">
  <div class="card p-4 shadow-sm" style="width: 400px; max-width: 100%;">
      <div class="text-center mb-4">
          <h2 class="h4">ProcessMaker Go</h2>
          <p class="text-muted">Sign in to your account</p>
      </div>
      
      <form action="/api/1.0/login" method="POST" id="loginForm">
          <div class="form-group mb-3">
              <label for="username">Username</label>
              <input type="text" class="form-control" id="username" name="username" required>
          </div>
          <div class="form-group mb-3">
              <label for="password">Password</label>
              <input type="password" class="form-control" id="password" name="password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Sign In</button>
      </form>
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const fd = new FormData(this);
  const data = Object.fromEntries(fd);
  
  try {
      const res = await fetch('/api/1.0/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
      });
      const result = await res.json();
      
      if(result.token) {
          // Store token and redirect
          localStorage.setItem('bearer_token', result.token);
          // Set a cookie so Go can read it next time (POC)
          document.cookie = "jwt=" + result.token + "; path=/";
          window.location.href = '/processes';
      } else {
          alert("Login failed: " + (result.message || 'Unknown error'));
      }
  } catch(error) {
      alert("Error: " + error.message);
  }
});
</script>
